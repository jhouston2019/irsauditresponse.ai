<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your account | IRS Audit Defense Pro</title>
  <meta name="description" content="Complete your IRS Audit Defense Pro account after checkout." />
  <meta name="supabase-url" content="%%SUPABASE_URL%%" />
  <meta name="supabase-anon-key" content="%%SUPABASE_ANON_KEY%%" />
  <link rel="canonical" href="https://irsauditresponseai.netlify.app/register" />
</head>
<body style="background:#0f172a; color:#ffffff; font-family:'Inter',sans-serif; margin:0; padding:0; line-height:1.5;">
  <nav style="background:#1e293b; padding:1rem; box-shadow:0 1px 4px rgba(0,0,0,0.1); display:flex; justify-content:space-between; border-bottom: 2px solid #334155;">
    <div style="color: #f5f5f5;"><strong>IRS Audit Defense Pro</strong></div>
    <div>
      <a href="/pricing" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Pricing</a> |
      <a href="/login" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Log in</a>
    </div>
  </nav>

  <div style="width:min(1120px, 92%); margin-inline:auto; padding:2rem 0;">
    <div id="verifyPanel" style="max-width:500px; margin:2rem auto; padding:2rem; background:#ffffff; border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,0.1); color:#2d3748; border:1px solid #e2e8f0;">
      <p id="verifyMsg" style="text-align:center; margin:0;">Verifying your payment…</p>
    </div>

    <div id="formPanel" style="display:none; max-width:500px; margin:2rem auto; padding:2rem; background:#ffffff; border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,0.1); color:#2d3748; border:1px solid #e2e8f0;">
      <h2 style="text-align:center; margin-bottom:0.5rem; color:#2d3748; font-size:1.8rem;">Create your account</h2>
      <p style="text-align:center; color:#64748b; margin-bottom:1.5rem; font-size:0.95rem;">Payment confirmed—this creates your secure workspace and links your purchase. Use the checkout email below (or yours if empty), choose a password, then you’ll return to the wizard with everything unlocked.</p>
      <form id="registerForm">
        <div style="margin-bottom:1.25rem;">
          <label for="email" style="display:block; margin-bottom:0.5rem; font-weight:bold; color:#2d3748;">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" style="width:100%; padding:14px 16px; border:2px solid #e2e8f0; border-radius:10px; font-family:'Inter',sans-serif; font-size:1rem; background:#ffffff; color:#2d3748; box-sizing:border-box;" />
        </div>
        <div style="margin-bottom:1.25rem;">
          <label for="password" style="display:block; margin-bottom:0.5rem; font-weight:bold; color:#2d3748;">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" style="width:100%; padding:14px 16px; border:2px solid #e2e8f0; border-radius:10px; font-family:'Inter',sans-serif; font-size:1rem; background:#ffffff; color:#2d3748; box-sizing:border-box;" />
        </div>
        <div style="margin-bottom:1.25rem;">
          <label for="password2" style="display:block; margin-bottom:0.5rem; font-weight:bold; color:#2d3748;">Confirm password</label>
          <input type="password" id="password2" name="password2" required minlength="6" autocomplete="new-password" style="width:100%; padding:14px 16px; border:2px solid #e2e8f0; border-radius:10px; font-family:'Inter',sans-serif; font-size:1rem; background:#ffffff; color:#2d3748; box-sizing:border-box;" />
        </div>
        <button type="submit" style="background:#334155; color:white; padding:14px 28px; border:none; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif; font-size:1rem; font-weight:600; width:100%;">Create account</button>
      </form>
      <p id="formErr" style="color:#b91c1c; margin-top:1rem; text-align:center; font-size:0.95rem; min-height:1.2em;"></p>
    </div>
  </div>

  <script type="module">
    console.log('[register] module script executing (no DOMContentLoaded wrapper)');

    function supabaseConfiguredInPage() {
      const url = document.querySelector('meta[name="supabase-url"]')?.content?.trim?.() ?? '';
      const key = document.querySelector('meta[name="supabase-anon-key"]')?.content?.trim?.() ?? '';
      return !!(url && key && !url.includes('%%') && !key.includes('%%'));
    }

    let browserSupabase;
    async function loadCreateClient() {
      return (await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm')).createClient;
    }
    async function getSupabaseEphemeralSignup() {
      const url = document.querySelector('meta[name="supabase-url"]')?.content?.trim?.() ?? '';
      const key = document.querySelector('meta[name="supabase-anon-key"]')?.content?.trim?.() ?? '';
      if (!url || !key || url.includes('%%') || key.includes('%%')) {
        throw new Error(
          'Auth is not wired on this build (missing SUPABASE_URL / SUPABASE_ANON_KEY in Netlify env, or placeholders not substituted). Fix env vars and redeploy.',
        );
      }
      const createClient = await loadCreateClient();
      return createClient(url, key, {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false,
        },
      });
    }

    async function getSupabaseBrowser() {
      if (browserSupabase) return browserSupabase;
      const url = document.querySelector('meta[name="supabase-url"]')?.content?.trim?.() ?? '';
      const key = document.querySelector('meta[name="supabase-anon-key"]')?.content?.trim?.() ?? '';
      if (!url || !key || url.includes('%%') || key.includes('%%')) {
        throw new Error(
          'Auth is not wired on this build (missing SUPABASE_URL / SUPABASE_ANON_KEY in Netlify env, or placeholders not substituted). Fix env vars and redeploy.',
        );
      }
      const createClient = await loadCreateClient();
      browserSupabase = createClient(url, key, {
        auth: { persistSession: true, detectSessionInUrl: false, storage: localStorage },
      });
      return browserSupabase;
    }

    function withTimeout(promise, ms, message) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms)),
      ]);
    }

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    console.log('[register] session_id from URL:', sessionId ? `present (length ${sessionId.length})` : 'missing');

    const verifyPanel = document.getElementById('verifyPanel');
    const verifyMsg = document.getElementById('verifyMsg');
    const formPanel = document.getElementById('formPanel');
    const formErr = document.getElementById('formErr');

    function goPricing() {
      window.location.replace('/pricing');
    }

    if (!sessionId) {
      console.log('[register] no session_id — redirecting to /pricing');
      goPricing();
    } else {
      (async () => {
        console.log('[register] starting payment verification retries');
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        let ok = false;
        let stripeCustomerEmail = '';
        for (let attempt = 1; attempt <= 3; attempt++) {
          verifyMsg.textContent = 'Confirming your payment…';
          try {
            console.log('[register] before verify-session fetch', { attempt });
            const res = await fetch('/.netlify/functions/verify-session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ session_id: sessionId }),
            });
            let bodyText = '';
            try {
              bodyText = await res.clone().text();
              console.log('[register] after verify-session response', { attempt, status: res.status, ok: res.ok, body: bodyText.slice(0, 800) });
            } catch (logErr) {
              console.log('[register] after verify-session response', { attempt, status: res.status, ok: res.ok, bodyReadError: String(logErr) });
            }
            if (res.ok) {
              try {
                const j = JSON.parse(bodyText || '{}');
                stripeCustomerEmail = typeof j.customer_email === 'string' ? j.customer_email.trim() : '';
              } catch (_) {
                stripeCustomerEmail = '';
              }
              ok = true;
              break;
            }
          } catch (fetchErr) {
            console.log('[register] verify-session fetch threw', { attempt, error: String(fetchErr) });
            /* retry */
          }
          if (attempt < 3) await sleep(1500);
        }
        if (!ok) {
          console.log('[register] verification failed after retries — redirecting to /pricing');
          goPricing();
          return;
        }
        console.log('[register] verification OK — showing account form');
        verifyPanel.style.display = 'none';
        formPanel.style.display = 'block';
        formErr.textContent = '';
        if (stripeCustomerEmail) {
          const emailEl = document.getElementById('email');
          if (emailEl && !emailEl.value.trim()) emailEl.value = stripeCustomerEmail;
        }
        if (!supabaseConfiguredInPage()) {
          formErr.innerHTML =
            'This deployed page doesn’t include Supabase keys (missing or still <code>%%</code> placeholders). In Netlify: set <strong>SUPABASE_URL</strong> and <strong>SUPABASE_ANON_KEY</strong>, redeploy so account creation works.';
          formErr.style.textAlign = 'left';
          formErr.style.color = '#b45309';
        }
      })();
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn?.disabled) return;
      formErr.textContent = '';
      formErr.style.color = '';
      formErr.style.textAlign = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      if (password !== password2) {
        formErr.textContent = 'Passwords do not match.';
        return;
      }
      try {
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account…';
        }
        console.log('[register] signUp via ephemeral client (no persistSession — avoids auth lock hang)');
        const supabaseEphem = await getSupabaseEphemeralSignup();
        const { data, error } = await withTimeout(
          supabaseEphem.auth.signUp({ email, password }),
          45000,
          'Sign-up request timed out. Check your network, disable extensions that block requests, and try again.',
        );
        console.log('[register] after supabase.auth.signUp', { hasUser: !!data?.user, error: error?.message });
        if (error) {
          const msg = error.message || '';
          const lc = msg.toLowerCase();
          const code = error.code ?? '';
          if (
            lc.includes('seconds') ||
            lc.includes('rate') ||
            lc.includes('too many requests') ||
            code === 'over_request_rate_limit' ||
            String(error.status) === '429'
          ) {
            formErr.textContent =
              'Supabase briefly limited signup attempts. Wait about one minute, then tap Create account once (avoid double-clicks).';
          } else {
            formErr.textContent = msg;
          }
          return;
        }
        const userId = data.user?.id;
        if (!userId) {
          formErr.textContent = 'Could not create user. Try again or log in if you already have an account.';
          return;
        }
        const rec = await fetch('/.netlify/functions/record-purchase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, user_id: userId }),
        });
        if (!rec.ok) {
          const j = await rec.json().catch(() => ({}));
          const suffix = [j.step, j.code].filter(Boolean).join(' ');
          formErr.textContent =
            j.error ||
            (!rec.ok ? `Could not finalize purchase (${rec.status}${suffix ? `: ${suffix}` : ''}).` : '') ||
            'Contact support with your checkout receipt.';
          return;
        }
        console.log('[register] record-purchase OK — persisted session then redirect');
        const supabase = await getSupabaseBrowser();
        let { data: { session: sess } } = await supabase.auth.getSession();
        if (!sess) {
          const { error: signInErr } = await withTimeout(
            supabase.auth.signInWithPassword({ email, password }),
            45000,
            'Sign-in after sign-up timed out. Try logging in manually.',
          );
          if (signInErr) {
            console.log('[register] signIn after signup:', signInErr.message);
            window.location.href = '/login?next=' + encodeURIComponent('/audit-defense.html');
            return;
          }
          ({ data: { session: sess } } = await supabase.auth.getSession());
        }
        window.location.href = '/audit-defense.html';
      } catch (err) {
        formErr.textContent = err.message || 'Something went wrong.';
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create account';
        }
      }
    });
  </script>
</body>
</html>
