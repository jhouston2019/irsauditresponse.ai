<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Dashboard | IRS Audit Defense Pro</title>
    <meta name="description" content="Access your IRS Audit Defense Pro dashboard.">
    <meta name="supabase-url" content="%%SUPABASE_URL%%">
    <meta name="supabase-anon-key" content="%%SUPABASE_ANON_KEY%%">
    <meta name="stripe-price-id" content="%%STRIPE_PRICE_ID%%">
    <link rel="canonical" href="https://irsauditresponseai.netlify.app/dashboard">
    <style>
        #letterModal[open] { display: flex; align-items: center; justify-content: center; }
        #letterModal::backdrop { background: rgba(15, 23, 42, 0.65); }
        #letterModal .inner {
            background: #fff; color: #1f2937; max-width: 900px; width: 92%; max-height: 85vh; overflow: auto;
            border-radius: 12px; padding: 1.25rem 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        #letterModal .modal-meta-wrap { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid #e2e8f0; }
        #letterModal .modal-meta-section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 0.75rem; }
        #letterModal .modal-meta-section:last-child { margin-bottom: 0; }
        #letterModal .modal-meta-section h3 { margin: 0 0 0.65rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; font-weight: 700; }
        #letterModal .modal-meta-row { font-size: 0.9rem; margin-bottom: 0.45rem; color: #334155; }
        #letterModal .modal-meta-row:last-child { margin-bottom: 0; }
        #letterModal .modal-meta-label { font-weight: 600; color: #0f172a; margin-right: 0.35rem; }
        #letterModal .modal-meta-plain { margin: 0.35rem 0 0; font-size: 0.9rem; line-height: 1.5; color: #475569; white-space: pre-wrap; }
        #letterModal pre { white-space: pre-wrap; font-family: 'Courier New', ui-monospace, monospace; font-size: 0.82rem; line-height: 1.5; margin: 0; }
    </style>
</head>
<body style="background:#0f172a; color:#ffffff; font-family:'Inter',sans-serif; margin:0; padding:0; line-height:1.5;">
    <nav style="background:#1e293b; padding:1rem; box-shadow:0 1px 4px rgba(0,0,0,0.1); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; border-bottom: 2px solid #334155;">
        <div style="color: #f5f5f5;"><strong>IRS Audit Defense Pro</strong></div>
        <div style="display:flex; align-items:center; flex-wrap:wrap; gap:0.5rem;">
            <button type="button" id="navReviewAnotherBtn" style="background:#2563eb; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:600; cursor:pointer; font-size:0.9rem;">Review Another Notice</button>
            <span id="navReviewAnotherErr" style="color:#fecaca; font-size:0.75rem; max-width:200px; line-height:1.35;"></span>
            <span style="color:#64748b;">|</span>
            <a href="/dashboard.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Dashboard</a>
            <a href="/login" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Log in</a>
        </div>
    </nav>

    <div style="width:min(1120px, 92%); margin-inline:auto; padding:2rem 0;">
        <div id="purchaseBanner" style="display:none; margin-bottom:1.25rem; padding:1rem 1.25rem; background:#422006; color:#fde68a; border-radius:10px; border:1px solid #b45309; font-size:0.95rem;"></div>

        <h1 style="color:#ffffff; font-size:2.5rem; margin-bottom:1rem;">Your letters</h1>
        <p style="color:#94a3b8; margin-bottom:1.5rem;">Letters you generate in the wizard appear here.</p>

        <div id="docList" style="display:flex; flex-direction:column; gap:1rem;">
            <p style="color:#94a3b8;">Loading…</p>
        </div>
    </div>

    <dialog id="letterModal" style="border:none; padding:0; background:transparent; max-width:100vw;">
        <div class="inner">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1rem;">
                <h2 id="letterModalTitle" style="margin:0; font-size:1.15rem; color:#0f172a;">Letter</h2>
                <button type="button" id="letterModalClose" style="background:#e2e8f0; border:none; padding:0.5rem 1rem; border-radius:8px; cursor:pointer; font-weight:600;">Close</button>
            </div>
            <div id="letterModalMeta" class="modal-meta-wrap" hidden></div>
            <pre id="letterModalBody"></pre>
        </div>
    </dialog>

    <script type="module">
        import { getSupabase } from '/src/components/Auth.js';

        const docList = document.getElementById('docList');
        const letterModal = document.getElementById('letterModal');
        const letterModalBody = document.getElementById('letterModalBody');
        const letterModalTitle = document.getElementById('letterModalTitle');
        const letterModalMeta = document.getElementById('letterModalMeta');
        document.getElementById('letterModalClose').addEventListener('click', () => letterModal.close());

        function escapeHtml(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function formatDate(iso) {
            if (!iso) return '—';
            try {
                return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
            } catch {
                return iso;
            }
        }

        function noticeTypeFromJob(row) {
            try {
                const raw = row?.letter_full;
                if (typeof raw === 'string' && raw.trim()) {
                    const o = JSON.parse(raw);
                    if (o && typeof o.noticeType === 'string' && o.noticeType.trim()) {
                        return o.noticeType.trim();
                    }
                }
            } catch {
                /* ignore */
            }
            return 'Notice';
        }

        /**
         * Analysis object: prefer analysis_json on row if present, else JSON in letter_full
         * (letter_full is JSON.stringify(analysis) from analyze-notice — not plain text).
         */
        function parseJobAnalysis(row) {
            if (!row) return null;
            const aj = row.analysis_json;
            if (aj != null) {
                if (typeof aj === 'object' && aj !== null && !Array.isArray(aj)) return aj;
                if (typeof aj === 'string' && aj.trim()) {
                    try {
                        return JSON.parse(aj);
                    } catch {
                        /* fall through */
                    }
                }
            }
            const raw = row.letter_full;
            if (typeof raw !== 'string' || !raw.trim()) return null;
            try {
                return JSON.parse(raw);
            } catch {
                return null;
            }
        }

        function strategyDisplayLabel(code) {
            const v = String(code || '').toLowerCase().trim();
            const map = {
                agree: 'Full Agreement',
                partial: 'Partial Agreement',
                dispute: 'Full Dispute',
                extension: 'Request Extension',
                other: 'Other / Custom',
                custom: 'Other / Custom',
            };
            return map[v] || '';
        }

        function buildLetterModalMetaHtml(doc) {
            const analysis = parseJobAnalysis(doc);
            const stratRaw = doc?.selected_strategy;
            const stratLabel = strategyDisplayLabel(stratRaw) || (stratRaw && String(stratRaw).trim() ? String(stratRaw).trim() : '');

            const noticeType = analysis && typeof analysis.noticeType === 'string' ? analysis.noticeType.trim() : '';
            const taxYear = analysis && typeof analysis.taxYear === 'string' ? analysis.taxYear.trim() : '';
            const riskLevel = analysis && typeof analysis.riskLevel === 'string' ? analysis.riskLevel.trim() : '';
            const plainEnglish =
                analysis && typeof analysis.plainEnglish === 'string' ? analysis.plainEnglish.trim() : '';

            const hasAnalysisBlock = noticeType || taxYear || riskLevel || plainEnglish;
            const hasStrategy = Boolean(stratLabel);

            if (!hasAnalysisBlock && !hasStrategy) {
                return '';
            }

            let html = '';
            if (hasAnalysisBlock) {
                html += '<div class="modal-meta-section"><h3>Analysis summary</h3>';
                if (noticeType) {
                    html += `<div class="modal-meta-row"><span class="modal-meta-label">Notice type</span>${escapeHtml(noticeType)}</div>`;
                }
                if (taxYear) {
                    html += `<div class="modal-meta-row"><span class="modal-meta-label">Tax year</span>${escapeHtml(taxYear)}</div>`;
                }
                if (riskLevel) {
                    html += `<div class="modal-meta-row"><span class="modal-meta-label">Risk level</span>${escapeHtml(riskLevel)}</div>`;
                }
                if (plainEnglish) {
                    html += `<p class="modal-meta-plain">${escapeHtml(plainEnglish)}</p>`;
                }
                html += '</div>';
            }
            if (hasStrategy) {
                html += '<div class="modal-meta-section"><h3>Strategy</h3>';
                html += `<div class="modal-meta-row">${escapeHtml(stratLabel)}</div>`;
                html += '</div>';
            }
            return html;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const supabase = getSupabase();
            const { data: { session } } = await supabase.auth.getSession();
            const urlParams = new URLSearchParams(window.location.search || '');
            if (urlParams.get('purchase_reconnect') === '1') {
                const msg = sessionStorage.getItem('pending_purchase_message') ||
                    'Your account was created. We are reconnecting your purchase.';
                const b = document.getElementById('purchaseBanner');
                if (b) {
                    b.textContent = msg;
                    b.style.display = 'block';
                }
            }

            const pendingSid = sessionStorage.getItem('pending_purchase_session_id');
            const retryKey = 'pending_purchase_dashboard_retry_done';
            let sessionOut = session;

            if (!sessionOut) {
                if (pendingSid) {
                    const next =
                        '/dashboard.html?purchase_reconnect=1' +
                        window.location.hash;
                    window.location.href =
                        '/login?next=' + encodeURIComponent(next);
                    return;
                }
                window.location.href = '/pricing';
                return;
            }

            if (pendingSid && !sessionStorage.getItem(retryKey)) {
                sessionStorage.setItem(retryKey, '1');
                const token = sessionOut.access_token;
                try {
                    const res = await fetch('/.netlify/functions/record-purchase', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: token ? `Bearer ${token}` : '',
                        },
                        body: JSON.stringify({
                            session_id: pendingSid,
                            user_id: sessionOut.user.id,
                            stripe_session_id: pendingSid,
                        }),
                    });
                    const body = await res.json().catch(() => ({}));
                    if (res.ok) {
                        sessionStorage.removeItem('pending_purchase_session_id');
                        sessionStorage.removeItem('pending_purchase_message');
                        sessionStorage.removeItem(retryKey);
                        const redirectTo =
                            typeof body.redirect === 'string' &&
                            body.redirect.startsWith('/') ?
                                body.redirect : '/audit-defense.html';
                        if (body.already_processed) {
                            const b = document.getElementById('purchaseBanner');
                            if (b) {
                                b.textContent =
                                    'Purchase linked. You can open the wizard any time.';
                                b.style.display = 'block';
                            }
                        }
                        console.log('[dashboard] pending record-purchase ok, redirect:', redirectTo);
                        window.location.replace(redirectTo);
                        return;
                    }
                    console.warn('[dashboard] pending record-purchase failed', res.status, body);
                    const b = document.getElementById('purchaseBanner');
                    if (b) {
                        b.textContent =
                            (body.error || 'Purchase could not be linked yet.') +
                            ' You can retry from Pricing or contact support.';
                        b.style.display = 'block';
                    }
                } catch (err) {
                    console.warn('[dashboard] pending record-purchase threw', err);
                }
                sessionStorage.removeItem(retryKey);
                const { data: { session: s2 } } = await supabase.auth.getSession();
                sessionOut = s2 || sessionOut;
            }

            const { data: rows, error } = await supabase
                .from('audit_jobs')
                .select('*')
                .eq('user_id', sessionOut.user.id)
                .order('created_at', { ascending: false });

            console.log(JSON.stringify({
                fn: 'dashboard',
                phase: 'fetch_audit_jobs',
                userId: sessionOut.user.id,
                ok: !error,
                rowCount: (rows || []).length,
            }));

            if (error) {
                docList.innerHTML = '<p style="color:#fca5a5;">Could not load letters.</p>';
                return;
            }

            const jobs = (rows || []).slice().sort((a, b) => {
                const ta = new Date(a.updated_at || a.created_at || 0).getTime();
                const tb = new Date(b.updated_at || b.created_at || 0).getTime();
                return tb - ta;
            });

            function statusLabel(s) {
                const v = String(s || 'draft').toLowerCase();
                if (v === 'letter_ready') return 'Letter ready';
                if (v === 'analyzed') return 'Analyzed';
                if (v === 'error') return 'Needs attention';
                return 'In progress';
            }

            if (jobs.length === 0) {
                docList.innerHTML = `
                    <div style="background:#1e293b; border:1px solid #334155; border-radius:12px; padding:2rem; color:#e2e8f0;">
                        <p style="margin:0 0 1rem;">No saved notices yet. Complete the wizard to start a job.</p>
                        <a href="/audit-defense.html" style="color:#93c5fd; font-weight:600;">Open the wizard →</a>
                    </div>`;
                return;
            }

            docList.innerHTML = jobs.map((doc) => {
                const nt = noticeTypeFromJob(doc);
                const st = statusLabel(null);
                const dt = formatDate(doc.updated_at || doc.created_at);
                const safeId = escapeHtml(doc.id);
                const hasLetter = doc.letter_html != null && String(doc.letter_html).trim() !== '';
                const btnStyle = hasLetter
                    ? 'background:#334155; color:#fff; border:none; padding:10px 18px; border-radius:8px; font-weight:600; cursor:pointer;'
                    : 'background:#475569; color:#cbd5e1; border:none; padding:10px 18px; border-radius:8px; font-weight:600; cursor:not-allowed; opacity:0.85;';
                return `
                    <div style="background:#ffffff; color:#1f2937; border-radius:12px; padding:1.25rem 1.5rem; border:1px solid #e2e8f0; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem;">
                        <div>
                            <div style="font-weight:700; font-size:1.05rem;">${escapeHtml(nt)}</div>
                            <div style="font-size:0.9rem; color:#64748b; margin-top:0.25rem;"><span style="font-weight:600;color:#334155;">${escapeHtml(st)}</span> · ${escapeHtml(dt)}</div>
                        </div>
                        <button type="button" class="view-letter-btn" data-id="${safeId}" ${hasLetter ? '' : 'disabled'} style="${btnStyle}">${hasLetter ? 'View letter' : 'Letter not saved yet'}</button>
                    </div>`;
            }).join('');

            const byId = Object.fromEntries(jobs.map((d) => [d.id, d]));

            docList.querySelectorAll('.view-letter-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-id');
                    const doc = byId[id];
                    if (!doc || !doc.letter_html || !String(doc.letter_html).trim()) return;
                    letterModalTitle.textContent = noticeTypeFromJob(doc);
                    const metaHtml = buildLetterModalMetaHtml(doc);
                    if (metaHtml) {
                        letterModalMeta.innerHTML = metaHtml;
                        letterModalMeta.hidden = false;
                    } else {
                        letterModalMeta.innerHTML = '';
                        letterModalMeta.hidden = true;
                    }
                    letterModalBody.textContent = doc.letter_html || '';
                    letterModal.showModal();
                });
            });
        });
    </script>
    <script src="/nav-review-notice.js" defer></script>
</body>
</html>
